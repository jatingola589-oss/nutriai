<!DOCTYPE html>
<html>
<head>
    <title>Login | AI Diet Consultant</title>
    <style>
        body {
            background: #071b16;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: #102a22;
            padding: 30px;
            border-radius: 18px;
            width: 85%;
            max-width: 350px;
        }
        h1 {
            color: #39d98a;
            text-align: center;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #39d98a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
        a { color: #39d98a; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Welcome Back</h1>

        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p>New user? <a href="/signup/">Create Account</a></p>
    </div>
</body>
</html>0
