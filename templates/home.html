<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriAI - AI Diet Consultant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: #071b16;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, #155d46 0, transparent 35%),
                radial-gradient(circle at 80% 70%, #123c53 0, transparent 35%),
                #071b16;
            animation: glow 7s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes glow {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #39d98a;
            letter-spacing: 3px;
            animation: appear 1s ease;
        }

        .leaf {
            font-size: 75px;
            margin: 30px 0;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(32px, 8vw, 52px);
            line-height: 1.2;
            animation: appear 1.2s ease;
        }

        h1 span {
            color: #39d98a;
        }

        p {
            color: #c5d5ce;
            font-size: 16px;
            line-height: 1.7;
            max-width: 420px;
            margin: 20px auto 30px;
            animation: appear 1.5s ease;
        }

        .start-btn {
            display: inline-block;
            padding: 16px 38px;
            background: #39d98a;
            color: #071b16;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 20px #39d98a66;
            transition: 0.3s;
            animation: pulse 2s infinite;
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 35px #39d98a;
        }

        .footer {
            margin-top: 45px;
            color: #91aa9e;
            font-size: 12px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px #39d98a55; }
            50% { box-shadow: 0 0 30px #39d98a; }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div class="background"></div>

<main class="container">

    <div class="logo">🌿 NUTRIAI</div>

    <div class="leaf">🥗</div>

    <h1>
        Welcome to<br>
        <span>AI Diet Consultant</span>
    </h1>

    <p>
        Your journey towards smarter food choices
        and healthier habits starts here.
        Get personalized guidance with NutriAI.
    </p>

    <a href="{% url 'login' %}" class="start-btn">
        GET STARTED →
    </a>

    <div class="footer">
        SMARTER CHOICES • HEALTHIER HABITS
    </div>

</main>

</body>
</html>
