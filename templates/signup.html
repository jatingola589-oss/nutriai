<!DOCTYPE html>
<html>
<head>
    <title>Create Account | AI Diet Consultant</title>
    <style>
        body {
            background: #071b16;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: #102a22;
            padding: 30px;
            border-radius: 18px;
            width: 85%;
            max-width: 350px;
        }
        h1 { color: #39d98a; text-align: center; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 9px 0;
            border-radius: 8px;
            border: none;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #39d98a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
        }
        a { color: #39d98a; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Create Account</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>

        <p>Already have an account? <a href="/login/">Login</a></p>
    </div>
</body>
</html>0
